<meta charset="utf-8">
<title>하이웨이 드라이버</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 한 화면 세로 흐름 — 밤 도로(캔버스) → 계기판 → 지금 고를 것 → 주행 기록. 밤 운전 게임이라 어두운 한 가지 룩으로 고정. */
:root {
  color-scheme: dark;
  --night: #0a0f17;      /* 바탕 */
  --panel: #111925;      /* 카드 */
  --panel-2: #172233;    /* 버튼·칸 */
  --line: #263449;       /* 테두리 */
  --ink: #e7ecf3;        /* 본문 */
  --muted: #8a97aa;      /* 보조 */
  --sign: #0e7a4b;       /* 고속도로 표지판 녹색 */
  --sign-ink: #f4fff8;
  --amber: #ffb547;      /* 계기판 호박색 */
  --red: #ff5a52;        /* 미등·위험 */
  --ok: #52d68f;         /* 무사 */
  --blue: #6fb6ff;       /* 행운 */
  --display: "Black Han Sans", "Gothic A1", "Malgun Gothic", sans-serif;
  --body: "Gothic A1", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "Share Tech Mono", ui-monospace, "Consolas", monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); }
body {
  margin: 0; font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.app { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
button { font: inherit; color: inherit; }
button:focus-visible, .stepper button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* 상단 표지판 */
.sign {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--sign); color: var(--sign-ink); border: 3px solid var(--sign-ink);
  border-radius: 10px; padding: 10px 16px; box-shadow: 0 0 0 3px var(--sign);
}
.sign h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 38px); letter-spacing: 0.02em; line-height: 1.1; }
.sign .route { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 18px; }
.sign .titles { display: grid; gap: 2px; min-width: 0; flex: 1 1 320px; }
.sign .tagline { margin: 0; font-family: var(--display); font-size: clamp(15px, 3.4vw, 19px); line-height: 1.3; opacity: .92; text-wrap: balance; word-break: keep-all; }
.shield {
  display: inline-grid; place-items: center; width: 40px; height: 44px; background: #1d4fa3; color: #fff;
  border: 2px solid #fff; border-radius: 6px 6px 50% 50% / 6px 6px 40% 40%; font-family: var(--display); font-size: 18px;
  box-shadow: inset 0 9px 0 #d83a34;
}
.shield span { margin-top: 8px; }

/* 도로 장면 */
.scene { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #05080d; }
.scene canvas { display: block; width: 100%; height: clamp(180px, 34vw, 250px); }
.scene .ctl { position: absolute; right: 10px; top: 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: calc(100% - 110px); }
.scene .ctl button {
  font: inherit; font-size: 13px; color: var(--ink);
  background: rgba(5,8,13,.6); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer;
}
.scene .bgm[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }

/* 재시작 확인 창 */
.modal {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; overflow-y: auto; background: rgba(5,8,13,.72);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal .sheet { width: min(420px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.modal h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; }
.modal p { margin: 0; }
.scene .speedo {
  position: absolute; right: 12px; bottom: 10px; font-family: var(--mono); color: var(--amber);
  font-size: 30px; line-height: 1; text-shadow: 0 0 10px rgba(255,181,71,.5); text-align: right;
}
.scene .speedo small { display: block; font-size: 12px; color: var(--muted); text-shadow: none; }
.scene .clock {
  position: absolute; left: 12px; top: 10px; font-family: var(--mono); font-size: 20px; color: var(--ink);
  background: rgba(5,8,13,.55); padding: 2px 8px; border-radius: 6px;
}

/* 계기판 */
.dash { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.progress { display: grid; gap: 4px; }
.progress .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.progress .row b { font-family: var(--mono); font-weight: 400; color: var(--ink); font-size: 16px; }
.track { position: relative; height: 10px; background: var(--panel-2); border-radius: 5px; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--sign), var(--ok)); border-radius: 5px; transition: width .8s ease; }
.track .stop { position: absolute; top: -3px; width: 4px; height: 16px; background: var(--amber); border-radius: 2px; transform: translateX(-2px); }
.track .goal { position: absolute; right: -2px; top: -4px; width: 4px; height: 18px; background: var(--sign-ink); border-radius: 2px; }
.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.gauge { display: grid; gap: 3px; min-width: 0; }
.gauge .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.gauge .lab b { font-family: var(--mono); font-weight: 400; color: var(--ink); font-size: 14px; }
.bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s ease, background-color .6s; }
.range { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.range b { font-family: var(--mono); font-weight: 400; color: var(--ink); font-size: 15px; }
.range .tag { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid currentColor; }
.range .ok { color: var(--ok); } .range .mid { color: var(--amber); } .range .bad { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.chips b { font-family: var(--mono); font-weight: 400; color: var(--ink); font-size: 15px; }
.chips .luck b { color: var(--blue); }
.chips b.txt, .gauge .lab b.txt { font-family: var(--body); font-weight: 700; font-size: 14px; }   /* 한글 값은 본문 글꼴 */
.chips .ins b { color: var(--ok); }

/* 지금 고를 것 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-height: 220px; align-content: start; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.25; text-wrap: balance; }
.kicker { font-size: 12px; letter-spacing: .12em; color: var(--amber); }
.panel p { margin: 0; max-width: 62ch; }
.sub { color: var(--muted); font-size: 14px; }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.choice:hover:not(:disabled) { border-color: var(--amber); }
.choice:active:not(:disabled) { transform: translateY(1px); }
.choice:disabled { opacity: .45; cursor: not-allowed; }
.choice.picked:disabled { opacity: 1; border-color: var(--amber); cursor: default; }
.choice .t { font-weight: 700; }
.choice .d { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.choice .risk { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
.risk.safe { color: var(--ok); } .risk.mid { color: var(--amber); } .risk.high { color: var(--red); } .risk.luck { color: var(--blue); }
.modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.modes .choice { grid-template-columns: 1fr; align-content: start; }
.modes .kmh { font-family: var(--mono); font-size: 26px; line-height: 1; color: var(--amber); }
.modes .kmh small { font-size: 13px; color: var(--muted); }
.primary {
  justify-self: start; background: var(--amber); color: #1a1205; border: 0; border-radius: 10px; padding: 10px 22px;
  font-family: var(--display); font-size: 18px; cursor: pointer;
}
.primary:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 스탯 배분 */
.stats { display: grid; gap: 10px; }
.stat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat .name { font-family: var(--display); font-size: 19px; }
.stat .eff { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.stat output { font-family: var(--mono); font-size: 26px; line-height: 1; color: var(--amber); min-width: 2ch; text-align: right; }
/* 스탯 슬라이더: --val까지 주황, --cap까지 밝게(남은 점수로 갈 수 있는 곳), 그 뒤는 어둡게 */
.stat input[type="range"] {
  grid-column: 1 / -1; width: 100%; height: 30px; margin: 2px 0; background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none; --val: 50%; --cap: 100%;
}
.stat input[type="range"]::-webkit-slider-runnable-track {
  height: 8px; border-radius: 4px;
  background: linear-gradient(to right, var(--amber) 0 var(--val), var(--line) var(--val) var(--cap), var(--night) var(--cap) 100%);
}
.stat input[type="range"]::-moz-range-track {
  height: 8px; border-radius: 4px;
  background: linear-gradient(to right, var(--amber) 0 var(--val), var(--line) var(--val) var(--cap), var(--night) var(--cap) 100%);
}
.stat input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%;
  background: var(--ink); border: 4px solid var(--amber); box-shadow: 0 2px 6px rgba(0,0,0,.5);
}
.stat input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 4px solid var(--amber); }
.stat input[type="range"]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.pool { font-family: var(--mono); font-size: 15px; color: var(--muted); }
.pool b { color: var(--amber); font-weight: 400; font-size: 20px; }

/* 차 고르기 */
.cars { display: grid; gap: 8px; }
.car { grid-template-columns: auto minmax(0, 1fr) auto; }
.car .tier { font-family: var(--mono); font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.car .spec { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
.car.picked { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.car .risk { white-space: normal; text-align: right; }   /* 좁은 화면에서 「차간간격 크루즈 전용」이 제목을 밀어내지 않게 */

/* 주사위 */
.rollbox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.dice { display: flex; gap: 8px; }
.die { width: 40px; height: 40px; background: #f3f0e8; border-radius: 8px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-shadow: inset 0 -3px 0 #c9c3b5; }
.die i { width: 7px; height: 7px; border-radius: 50%; background: #1b1b1b; place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.spin { animation: wob .12s linear infinite; }
@keyframes wob { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
.d100 { font-family: var(--mono); font-size: 34px; line-height: 1; min-width: 3ch; text-align: center; background: #f3f0e8; color: #1b1b1b; border-radius: 8px; padding: 6px 8px; box-shadow: inset 0 -3px 0 #c9c3b5; }
.rollinfo { display: grid; gap: 2px; font-size: 14px; min-width: 0; }
.rollinfo .verdict { font-family: var(--display); font-size: 20px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--red); }
.fx { display: flex; flex-wrap: wrap; gap: 6px; }
.fx span { font-family: var(--mono); font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); }
.fx .pos { color: var(--ok); } .fx .neg { color: var(--red); }

.carprev { display: block; width: 100%; height: 130px; border-radius: 10px; border: 1px solid var(--line); background: #05080d; }

/* 코스 표시: 터널·다리 구간 */
.track .tun { position: absolute; top: 2px; height: 6px; background: var(--muted); opacity: .7; border-radius: 2px; }
.cam { color: var(--red); font-weight: 700; }

/* 5초 반응 이벤트 */
.qbar { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.qbar i { display: block; height: 100%; width: 100%; background: var(--red); }
.qbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qbtn {
  display: grid; gap: 2px; place-items: center; padding: 18px 10px; border-radius: 12px; cursor: pointer;
  background: var(--panel-2); border: 2px solid var(--red); color: var(--ink); font-family: var(--display); font-size: 24px;
}
.qbtn.hz { border-color: var(--amber); }
.qbtn small { font-family: var(--body); font-size: 12px; color: var(--muted); }
.qbtn.on { background: var(--red); color: #1a0504; }
.qbtn.hz.on { background: var(--amber); color: #1a1205; }
.qbtn:disabled { cursor: default; }

/* 업적 */
.achs { border-top: 1px dashed var(--line); padding-top: 10px; }
.achs summary { cursor: pointer; font-family: var(--display); font-size: 17px; color: var(--amber); }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.ach { display: grid; gap: 2px; align-content: start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); opacity: .5; min-width: 0; }
.ach.on { opacity: 1; border-color: var(--amber); }
.ach b { font-size: 14px; }
.ach small, .achip small { font-size: 12px; color: var(--muted); }
.achnew { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.achip { display: grid; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--amber); background: var(--panel-2); font-weight: 700; font-size: 14px; }

/* 제작자 실화 엔딩 크레딧 */
.credits { position: fixed; inset: 0; z-index: 50; background: var(--night); color: var(--ink); overflow: hidden; }
/* 안쪽 요소가 absolute라 여백(안전 영역)은 각 요소에 직접 준다 */
.credits .roll { position: absolute; left: 0; right: 0; top: 0; display: grid; gap: 30px; justify-items: center; text-align: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.credits .roll.still { position: static; height: 100%; overflow-y: auto; align-content: start; padding-bottom: 80px; }
.credits .ctitle {
  margin: 0; font-family: var(--display); font-size: clamp(30px, 7vw, 46px); color: var(--sign-ink);
  background: var(--sign); border: 3px solid var(--sign-ink); border-radius: 10px; padding: 6px 18px; box-shadow: 0 0 0 3px var(--sign);
}
.credits .cintro { display: grid; gap: 8px; justify-items: center; margin-bottom: 24px; }
.credits .cname { margin: 0; font-family: var(--display); font-size: clamp(28px, 6vw, 38px); color: var(--amber); }
.credits .cintro .small { max-width: 34ch; font-size: 15px; line-height: 1.8; color: var(--ink); }
.credits dl { display: grid; gap: 16px; margin: 0; }
.credits dl div { display: grid; gap: 2px; }
.credits dt { font-size: 13px; letter-spacing: .14em; color: var(--muted); }
.credits dd { margin: 0; font-family: var(--display); font-size: 28px; }
.credits h3 { margin: 0; font-size: 13px; letter-spacing: .14em; color: var(--amber); font-weight: 500; }
.credits .songs { display: grid; gap: 6px; font-size: 17px; }
.credits .small { margin: 0; font-size: 13px; color: var(--muted); max-width: 32ch; }
.credits .skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.credits .cend {
  position: absolute; inset: 0; overflow-y: auto; display: grid; align-content: start; justify-items: center; gap: 18px; text-align: center;
  padding: calc(36px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.credits .cend .primary { justify-self: center; }
.credits .achchips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 560px; }
.credits .achchips span { font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--amber); border-radius: 999px; }
.credits .rec2 { width: min(420px, 100%); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.credits .thanks { margin: 8px 0 0; font-family: var(--display); font-size: clamp(28px, 6vw, 40px); color: var(--amber); }
.credits .afterword {
  display: grid; gap: 10px; max-width: 46ch; text-align: left; line-height: 1.8;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
}
.credits .afterword p { margin: 0; }

/* 엔딩 */
.result { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.result div { display: grid; gap: 4px; align-content: start; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.result small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
/* 값은 본문 글꼴 굵게, 단위(시간·번·원)는 작고 흐리게. 숫자 칸은 줄이 바뀌지 않는다 */
.result b { font-family: var(--body); font-weight: 700; font-size: 18px; line-height: 1.25; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.result b u { font-size: 12.5px; font-weight: 500; text-decoration: none; color: var(--muted); margin: 0 3px 0 1px; }
.result .wide { grid-column: 1 / -1; }
.result .wide b { font-family: var(--body); font-size: 15px; font-weight: 700; line-height: 1.5; white-space: normal; }
.result .wide b span { color: var(--muted); font-weight: 500; }
.rank { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--amber); }

/* 주행 기록 */
.log { background: transparent; border-top: 1px dashed var(--line); padding-top: 10px; }
.log h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; color: var(--muted); max-height: 240px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 5.5ch minmax(0, 1fr); gap: 8px; }
.log li time { font-family: var(--mono); color: var(--amber); }
.log li.bad span { color: #ffb1ac; } .log li.good span { color: #a9efc6; }

@media (max-width: 480px) {
  .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
  .modes { grid-template-columns: 1fr; }
  .result { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel { padding: 14px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .die.spin { animation: none; }
  .track .fill, .bar i { transition: none; }
}
</style>

<main class="app">
  <header class="sign">
    <div class="titles">
      <p class="tagline" id="tagline" hidden>무사고로 열심히 달려왔는데 집에서 10분거리에서 사고나서 빡쳐서 만든 게임</p>
      <h1>하이웨이 드라이버</h1>
    </div>

      <div class="row"><span>달린 거리</span><span><b id="km">0</b> / <span id="goalKm">72</span>km</span></div>
      <div class="track" id="track"><div class="fill" id="trackFill" style="width:0%"></div><div class="goal"></div></div>
      <div class="row"><span>걸린 시간 <b id="elapsed">0:00</b></span><span id="nextStop">다음 휴게소 100km</span></div>
    </div>
    <div class="gauges">
      <div class="gauge"><div class="lab"><span>연료</span><b id="gFuel">80</b></div><div class="bar"><i id="bFuel"></i></div></div>
      <div class="gauge"><div class="lab"><span>차체</span><b id="gCar">100</b></div><div class="bar"><i id="bCar"></i></div></div>

      <span>차선 <b class="txt" id="cLane">2차로</b></span>
      <span>차 <b class="txt" id="cCar">-</b></span>

</main>

<script>
(() => {
"use strict";

/* ── 규칙 상수 ───────────────────────────────────────── */
const SEG = 30, START_CLOCK = 23 * 60, POOL = 18;
// 실제 노선. 제한속도는 기본 100, 고시 구간 110(경부 양재~천안, 서해안), 120은 세종포천 용인JCT~남안성JCT뿐.
// 길이·휴게소·터널 위치는 대략값이고, 이름 없는 터널은 위치만 잡은 것
const COURSES = [
  { id: "sp", name: "세종포천고속도로", no: 29, from: "구리", to: "안성", km: 72, star: 1,
    limits: [[0, 100], [38, 120], [69, 100]], stops: [],
    tunnels: [{ km: 22, name: "터널", len: 1.2 }],
    note: "짧다. 국내에 하나뿐인 제한속도 120km 구간이 있다." },
  { id: "sy", name: "서울양양고속도로", no: 60, from: "서울", to: "양양", km: 150, star: 2,
    limits: [[0, 100]], stops: [{ km: 40, name: "가평휴게소" }, { km: 110, name: "내린천휴게소" }],
    tunnels: [{ km: 30, name: "터널", len: 1.5 }, { km: 85, name: "터널", len: 2.1 }, { km: 125, name: "인제양양터널", len: 11 }],
    note: "터널이 끝도 없다. 마지막엔 국내에서 가장 긴 11km 인제양양터널." },
  { id: "yd", name: "영동고속도로", no: 50, from: "인천", to: "강릉", km: 234, star: 3,
    limits: [[0, 100]],
    stops: [{ km: 55, name: "용인휴게소" }, { km: 95, name: "여주휴게소" }, { km: 150, name: "횡성휴게소" }, { km: 195, name: "평창휴게소" }],
    tunnels: [{ km: 172, name: "둔내터널", len: 3.3 }, { km: 218, name: "대관령 터널 구간", len: 1.5 }],
    note: "정체의 대명사. 끝에는 대관령 내리막 터널." },
  { id: "sh", name: "서해안고속도로", no: 15, from: "서울", to: "목포", km: 340, star: 4,
    limits: [[0, 110]],
    stops: [{ km: 70, name: "행담도휴게소" }, { km: 115, name: "서산휴게소" }, { km: 170, name: "대천휴게소" }, { km: 275, name: "고창고인돌휴게소" }],
    tunnels: [{ km: 235, name: "터널", len: 1.0 }], bridge: { km: 65, name: "서해대교", len: 7.3 },
    note: "제한 110. 바다 위 7km 서해대교의 안개와 옆바람." },
  { id: "gb", name: "경부고속도로", no: 1, from: "서울", to: "부산", km: 416, star: 5,
    limits: [[0, 110], [80, 100]],
    stops: [{ km: 75, name: "안성휴게소" }, { km: 170, name: "금강휴게소" }, { km: 215, name: "추풍령휴게소" }, { km: 290, name: "칠곡휴게소" }, { km: 345, name: "건천휴게소" }],
    tunnels: [{ km: 195, name: "터널", len: 1.1 }, { km: 330, name: "터널", len: 0.8 }],
    note: "가장 길고 화물차가 가장 많다. 양재~천안만 110, 나머지는 100." },
];
let C = COURSES[0], GOAL = C.km, STOPS = C.stops;
const limitAt = km => C.limits.reduce((lim, [k, v]) => km >= k ? v : lim, 100);
const ukka = () => 1 + 0.15 * (C.star - 1);                     // 억까 계수: ★1 1.0 ~ ★5 1.6
const starStr = n => "★".repeat(n) + "☆".repeat(5 - n);
// 30분 한 구간 기준. 100·110은 2차로, 120·130은 1차로
const MODES = [
  { id: "m100", name: "100km/h", kmh: 100, lane: 2, km: 50, fuel: 6, fat: 5, base: 5, note: "흐름을 따라간다" },
  { id: "m110", name: "110km/h", kmh: 110, lane: 2, km: 55, fuel: 7, fat: 5, base: 7, note: "가끔 앞이 막혀 느려진다" },
  { id: "m120", name: "120km/h", kmh: 120, lane: 1, km: 60, fuel: 8, fat: 6, base: 10, note: "뒤에서 차가 바짝 붙는다" },
  { id: "m130", name: "130km/h", kmh: 130, lane: 1, km: 65, fuel: 9, fat: 7, base: 15, note: "뒤차가 못 따라붙는다. 대신 제일 위험하다" },
];
// cost = 재력 포인트. follow = 앞차 관련 사고율 배수, fatMult = 피로 누적 배수
const CARS = [
  { id: "none", name: "크루즈 없음", short: "크루즈 없음", cost: 1, fatMult: 1, follow: 1,
    desc: "밟는 만큼 간다. 오래 달리면 오른발이 먼저 지친다." },
  { id: "cc", name: "크루즈 있음 (차간간격 X)", short: "크루즈(간격 X)", cost: 4, fatMult: 0.75, follow: 1.4,
    desc: "속도는 알아서 유지한다. 앞차가 서도 이 차는 모른다." },
  { id: "acc", name: "크루즈 있음 (차간간격 O)", short: "크루즈(간격 O)", cost: 7, fatMult: 0.55, follow: 0.5,
    desc: "앞차와의 거리까지 맞춰 준다. 정체와 급정거에 강하다." },
];
// 차간간격 크루즈 전용 옵션
const NAVLINK = { cost: 2, name: "내비 연동",
  desc: "순정 내비가 달린 신형으로 바뀐다. 폰 배터리가 필요 없고, 단속 카메라 앞에서 알아서 감속해 과태료가 나오지 않는다." };
const STAT_INFO = {
  W: { name: "재력", help: "좋은 차를 사고, 사고가 나도 돈으로 수습한다. 여비가 0원이 되면 파산 엔딩." },
  L: { name: "행운", help: "막히는 일은 덜, 좋은 일은 더 생긴다. 운 판정에 보너스." },
  D: { name: "운전실력", help: "모든 사고 확률을 줄인다. 낮으면 빠른 선택이 위험하다." },
};

/* ── 스탯 공식 ───────────────────────────────────────── */
// 최대 스탯의 이점은 그대로 두고, 낮은 스탯일수록 가파르게 불리해진다 (1·1·1은 운이 미친 듯이 좋아야 산다)
const MOD = [0, -3, -2, -1, -1, 0, 0, 1, 1, 2, 3];          // 스탯 값 → 2d6 보정
const skillMult = d => 0.55 + 1.25 * Math.pow((10 - d) / 9, 1.6);  // 운전실력 → 사고율 배수: 1 ×1.8, 4 ×1.2, 6 ×0.89, 8 ×0.66, 10 ×0.55
const toneMult = (l, tone) => tone === "good" ? 0.3 + 0.13 * l : tone === "bad" ? 1.65 - 0.12 * l : 1;   // 나쁜 일: 행운 1 ×1.53, 6 ×0.93, 10 ×0.45
const startMoney = (w, car) => 30000 + (w - car.cost) * 40000;
const insCount = w => Math.floor(w / 4);
const cloverCount = l => Math.floor(l / 4);

/* ── 유틸 ────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const rnd = n => 1 + Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const won = n => Math.round(n).toLocaleString("ko-KR");
const sign = n => (n >= 0 ? "+" : "") + n;
const pad = n => String(n).padStart(2, "0");
const clockOf = t => { const m = Math.round(START_CLOCK + t) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
const dur = t => { const m = Math.round(t); return Math.floor(m / 60) + ":" + pad(m % 60); };
const durKo = t => { const m = Math.round(t); return (m >= 60 ? Math.floor(m / 60) + "시간 " : "") + (m % 60) + "분"; };
// 받침에 따라 조사 고르기: ro("폭주") → "폭주로", ro("과속") → "과속으로"
// 숫자로 끝나면 읽는 소리 기준 (0 영, 1 일, 3 삼, 6 육, 7 칠, 8 팔은 받침이 있다)
const DIGIT_BATCHIM = [21, 8, 0, 16, 0, 0, 1, 8, 8, 0];
const batchim = w => {
  const ch = w[w.length - 1];
  if (/\d/.test(ch)) return DIGIT_BATCHIM[+ch];
  const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c <= 11171 ? c % 28 : 0;
};
const ro = w => w + (batchim(w) === 0 || batchim(w) === 8 ? "로" : "으로");
const eul = w => w + (batchim(w) === 0 ? "를" : "을");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 재시작으로 판이 바뀌면 이전 판의 대기는 영영 풀리지 않는다 (이전 판 진행이 새 판에 섞이지 않게)
const wait = ms => { const run = S; return new Promise(r => setTimeout(() => { if (S === run) r(); }, reduced ? Math.min(ms, 120) : ms)); };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 2d6 + mod ≥ target. 6·6은 무조건 성공, 1·1은 무조건 실패
function p2d6(target, mod) {
  let c = 0;
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) {
    const s = a + b;
    if (s === 12 || (s !== 2 && s + mod >= target)) c++;
  }
  return Math.round(c / 36 * 100);
}

/* ── 진행 상태 ───────────────────────────────────────── */
let S = null;
let stats = { W: 6, L: 6, D: 6 };
let preview = { car: CARS[0], nav: false };   // 출발 전 도로 장면에 보여 줄 차

function newRun(car, navlink) {
  S = {
    stats: { ...stats }, car, navlink,
    km: 0, t: 0, fuel: 50, hp: 100, fat: 25, bat: 60, nav: true, lane: 2, skipStreak: 0,
    lastKmh: 100, segLimit: limitAt(0), tunnelsSeen: new Set(), bridgeSeen: false,
    hwyAccidents: null, inTown: false, hwyTime: 0, resting: false, ending: null,
    flags: new Set(), stopsEntered: 0,   // 업적용 기록
    money: startMoney(stats.W, car) - (navlink ? NAVLINK.cost * 40000 : 0),
    ins: insCount(stats.W), clover: cloverCount(stats.L),
    rain: 0, dolls: 0, fines: 0, accidents: 0, cloversUsed: 0,
    modes: { m100: 0, m110: 0, m120: 0, m130: 0 }, lastMode: null,
    stopsSeen: new Set(), seen: {}, seg: 0, over: false, speed: 0,
  };
}

// 피로: 30부터 모든 사고율이 곱으로 오르고(100이면 ×2.4), 50부터는 느리게 달려도 위험해진다(100이면 +10%p).
// 2d6 판정도 피로 60부터 −1, 85부터 −2
const fatMul = () => 1 + Math.max(0, S.fat - 30) / 50;
const fatAdd = () => Math.max(0, S.fat - 50) / 5;
const fatMod = () => S.fat >= 85 ? -2 : S.fat >= 60 ? -1 : 0;
// 고속도로 돌발 상황은 빠를수록 위험하다 (100 ×0.85 ~ 130 ×1.15). 동네 저속 구간은 그대로
const speedMult = () => S.inTown ? 1 : 0.85 + (S.lastKmh - 100) / 100;   // 끌려간 90km/h는 ×0.75
const luckMod = () => MOD[S.stats.L] + fatMod();
const skillMod = () => MOD[S.stats.D] + fatMod();
const skipMult = (n = S.skipStreak) => 1 + 0.3 * n;            // 휴게소를 연속으로 지나칠수록 피로가 빨리 쌓인다
function modeRisk(m) {
  let r = m.base + fatAdd();
  if (S.rain) r += 4 + (m.kmh - 100) / 5;
  if (S.hp < 40) r += 5;
  return clamp(Math.round(r * fatMul() * ukka() * skillMult(S.stats.D)), 1, 95);
}
// follow = 앞차와의 간격이 걸린 상황(크루즈 종류의 영향을 받음). 동네는 코스 억까 계수를 받지 않는다
function eventRisk(base, follow) {
  let r = base + fatAdd() + (S.rain ? 5 : 0);
  if (follow) r *= S.car.follow;
  r *= fatMul() * speedMult();
  return clamp(Math.round(r * (S.inTown ? 1 : ukka()) * skillMult(S.stats.D)), 1, 95);
}

// fx: { km, t, fuel, hp, fat, money, clover, ins, rain, dolls, fines }. 실제 변화량 칩을 돌려준다
function applyFx(fx) {
  if (!fx) return [];
  if (typeof fx === "function") fx = fx(S);
  const out = [];
  const add = (key, label, v, unit = "", goodIfUp = true, fmt = x => sign(x)) => {
    const r = Math.round(v); if (!r) return;   // 반올림해서 0이면 칩을 띄우지 않는다
    out.push({ txt: `${label} ${fmt(r)}${unit}`, pos: (r > 0) === goodIfUp });
  };
  if (fx.km) { const before = S.km; S.km = clamp(S.km + fx.km, 0, GOAL); add("km", "거리", S.km - before, "km"); }
  if (fx.t) { S.t += fx.t; add("t", "시간", fx.t, "분", false); }
  if (fx.fuel) { const b = S.fuel; S.fuel = clamp(S.fuel + fx.fuel, 0, 100); add("fuel", "연료", S.fuel - b); }
  if (fx.hp) { const b = S.hp; S.hp = clamp(S.hp + fx.hp, 0, 100); add("hp", "차체", S.hp - b); }
  if (fx.fat) { const b = S.fat; S.fat = clamp(S.fat + fx.fat, 0, 100); add("fat", "피로", S.fat - b, "", false); }
  if (fx.money) { S.money += fx.money; add("money", "여비", fx.money, "원", true, x => (x > 0 ? "+" : "") + won(x)); }
  if (fx.fines) { S.fines += fx.fines; out.push({ txt: `고지서 +${fx.fines}장`, pos: false }); }
  if (fx.clover) { S.clover = Math.max(0, S.clover + fx.clover); add("clover", "부적", fx.clover, "장"); }
  if (fx.ins) { S.ins = Math.max(0, S.ins + fx.ins); add("ins", "보험", fx.ins, "회"); }
  if (fx.rain) { S.rain = Math.max(S.rain, fx.rain); out.push({ txt: `비 ${fx.rain}구간`, pos: false }); }
  if (fx.dolls) { S.dolls += fx.dolls; out.push({ txt: `인형 +${fx.dolls}`, pos: true }); }
  if (fx.lane && fx.lane !== S.lane) { S.lane = fx.lane; out.push({ txt: `${fx.lane}차로로`, pos: true }); }
  renderDash();
  return out;
}

/* ── 이벤트 ──────────────────────────────────────────── */
// kind: none(바로 결과) / luck(2d6+행운 ≥ target) / risk(d100 사고 판정, 실패하면 사고)
const navOn = () => S.navlink || (S.nav && S.bat > 0);
// 승용차 과속 과태료: 20km/h 이하 초과 4만 원, 20~40km/h 7만 원.
// 제한속도는 구간을 출발할 때 본 표지판 기준(속도 고르는 화면·카메라·구간단속이 같은 값을 쓴다)
const overBy = () => S.lastKmh - S.segLimit;
const fineAmt = () => overBy() > 20 ? 70000 : 40000;
const fine = () => ({ money: -fineAmt(), fines: 1 });
const fast = () => overBy() > 0;

// 친구의 전화: 고속도로와 동네 둘 다에서 걸려 온다
const callChoices = town => [
  { t: "받는다", d: "수다를 떨면 잠은 깬다. 대신 운전에 집중이 안 된다", kind: "risk", risk: 30, call: true,
    cause: town ? "통화하다 골목에서 앞을 놓쳤다." : "통화에 신경 쓰다 앞을 놓쳤다.",
    ok: { text: "한참 수다를 떨었다. 잠이 확 깼다.", fx: { fat: -20 } } },
  { t: "거절한다", d: "피로는 그대로다", kind: "none",
    res: { text: "진동이 멈췄다. 졸음은 그대로다.", fx: () => { S.flags.add("callNo"); return {}; } } },
];

const EVENTS = [
  // 5초 안에 브레이크 + 비상등
  { id: "hazard", tone: "bad", w: 1.6, max: 2, title: "앞차 비상등", custom: () => hazardEvent("돌발") },

  { id: "section", tone: "neutral", w: 1.5, max: 2, when: fast, title: "구간단속 10km",
    text: () => S.navlink ? "구간단속 시작. 크루즈가 제한 속도로 맞춰 준다."

function drawEvent() {
  const pool = EVENTS.filter(e => (S.seen[e.id] || 0) < e.max && (!e.when || e.when()) && (typeof e.w !== "function" || e.w() > 0));
  const ws = pool.map(e => (typeof e.w === "function" ? e.w() : e.w) * toneMult(S.stats.L, e.tone) * (e.tone === "bad" ? ukka() : 1));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

};

function decorate(c) {
  const out = { t: c.t, d: c.d, meta: "", cls: "" };
  if (c.kind === "luck" && c.tiers) { out.meta = `대성공 ${p2d6(c.tiers[0].min, luckMod())}%`; out.cls = "luck"; }
  else if (c.kind === "luck") { out.meta = `성공률 ${p2d6(c.target, luckMod())}%`; out.cls = "luck"; }
  else if (c.kind === "risk") { const p = 100 - eventRisk(c.risk, c.follow); out.meta = `성공률 ${p}%`; out.cls = riskCls(p); }
  else if (c.cost) { out.meta = `${won(c.cost)}원`; out.disabled = S.money <=c.cost; }
  // 돈이 나가는 결과는 미리 보여 준다. 그 돈 때문에 파산하면 「→ 파산」
  const sure = -fxMoney(c.res && c.res.fx) || -fxMoney(c.ok && c.ok.fx);
  const onFail = -fxMoney(c.bad && c.bad.fx) || -fxMoney(c.ok && c.ok.luck && c.ok.luck.bad.fx);
  const note = (amt, pre) => `${pre}${won(amt)}원 나감${S.money - amt <= 0 ? " → 파산" : ""}`;
  if (!c.cost) {
    const amt = sure > 0 ? sure : onFail;
    if (amt > 0 && /원/.test(out.d || "")) { if (S.money - amt <= 0) out.d += " → 파산"; }   // 금액은 이미 적혀 있다
    else if (sure > 0) out.d = [out.d, note(sure, "")].filter(Boolean).join(" · ");
    else if (onFail > 0) out.d = [out.d, note(onFail, "잘못되면 ")].filter(Boolean).join(" · ");
  }
  return out;
}

// spec: { type: "d100", pct } — 굴림 ≤ 성공률이면 성공
//       { type: "2d6", mod, target } 또는 { type: "2d6", mod, tiers: [{min,...}] (내림차순) }
// 실패하면 행운 부적으로 다시 굴릴 수 있다. 성공·실패와 고른 단계를 돌려준다
async function roll(html, spec) {
  for (;;) {
    let desc;
    if (spec.type === "d100") desc = `d100 · ${spec.pct} 이하면 성공 · 성공률 ${spec.pct}%`;
    else if (spec.tiers) desc = `2d6 ${sign(spec.mod)} · ${spec.tiers.slice(0, -1).map(t => `${t.min}+`).join(" / ")}`;
    else desc = `2d6 ${sign(spec.mod)} · ${spec.target} 이상이면 성공 · 성공률 ${p2d6(spec.target, spec.mod)}%`;
    if (spec.label) desc = `${spec.label} — ${desc}`;
    if (spec.type === "2d6" && S && fatMod()) desc += ` (피로 ${fatMod()} 포함)`;
    panel.innerHTML = html + `<div class="rollbox"><div class="dice" id="dice"></div>` +
      `<div class="rollinfo"><span class="sub">${esc(desc)}</span><span class="verdict" id="verdict">…</span></div></div>`;
    const dice = $("dice");
    let res;
    if (spec.type === "d100") {
      const v = rnd(100);
      for (let i = 0; i < 9; i++) { dice.innerHTML = `<div class="d100">${rnd(100)}</div>`; await wait(60); }
      dice.innerHTML = `<div class="d100">${v}</div>`;
      res = { ok: v <= spec.pct, v };
    } else {
      const a = rnd(6), b = rnd(6);
      for (let i = 0; i < 9; i++) { dice.innerHTML = dieHtml(rnd(6), true) + dieHtml(rnd(6), true); await wait(60); }
      dice.innerHTML = dieHtml(a) + dieHtml(b);
      const total = a + b + spec.mod;
      res = { v: total, a, b };
      if (spec.tiers) {
        let idx = a + b === 12 ? 0 : a + b === 2 ? spec.tiers.length - 1 : spec.tiers.findIndex(t => total >= t.min);
        if (idx < 0) idx = spec.tiers.length - 1;   // 보정이 커서 가장 낮은 단계보다 더 낮게 나와도 맨 아래 단계
        res.tier = spec.tiers[idx]; res.idx = idx; res.ok = idx < spec.tiers.length - 1;
      } else res.ok = a + b === 12 || (a + b !== 2 && total >= spec.target);
    }
    const vEl = $("verdict");
    const shown = spec.type === "d100" ? `${res.v}` : `${res.a}+${res.b}${spec.mod ? sign(spec.mod) : ""} = ${res.v}`;
    vEl.textContent = `${shown} → ${spec.tiers ? (res.tier.label || (res.ok ? "성공" : "실패")) : res.ok ? "성공" : "실패"}`;
    vEl.className = "verdict " + (res.ok ? "ok" : "bad");
    if (res.ok || S.clover <= 0 || spec.noReroll) return res;
    const box = document.createElement("div");
    box.className = "btnrow";
    box.innerHTML = `<button class="primary" id="reroll">행운 부적으로 다시 굴리기 (${S.clover}장)</button><button class="ghost" id="accept">받아들인다</button>`;
    panel.appendChild(box);
    $("reroll").focus({ preventScroll: true });
    const again = await new Promise(r => { $("reroll").onclick = () => r(true); $("accept").onclick = () => r(false); });
    if (!again) { box.remove(); return res; }
    S.clover--; S.cloversUsed++; renderDash(); log("행운 부적을 썼다.", "good");
  }
}

/* ── 준비: 스탯 → 차 ─────────────────────────────────── */
function statScreen() {
  S = null; renderDash();
  const keys = ["W", "L", "D"];
  panel.innerHTML = head(`출발 준비 2/3 · ${C.name} ${starStr(C.star)}`, "스탯을 나눈다", `최대 ${POOL}점까지 재력·행운·운전실력에 나눈다. 하나당 1~10점. 다 안 써도 출발할 수 있다.`) +
    `<div class="pool">남은 점수 <b id="poolLeft"></b></div><div class="stats">${keys.map(k => `
      <div class="stat">
        <label class="name" for="s${k}">${STAT_INFO[k].name}</label>
        <output id="v${k}" for="s${k}"></output>
        <input type="range" id="s${k}" min="1" max="10" step="1" value="${stats[k]}" aria-describedby="e${k}">
        <span class="eff">${STAT_INFO[k].help}<br><span id="e${k}"></span></span>
      </div>`).join("")}</div>
    <div class="btnrow"><button class="primary" id="toCar">차 고르기</button><button class="ghost" id="rand">무작위로 나누기</button><button class="ghost" id="toCourse">코스 다시 고르기</button></div>`;
  // 막대: 채운 만큼 주황, 남은 점수로 더 갈 수 있는 구간은 밝게, 못 가는 구간은 어둡게
  const pos = v => (v - 1) / 9 * 100 + "%";
  const update = () => {
    const used = keys.reduce((a, k) => a + stats[k], 0), left = POOL - used;
    $("poolLeft").textContent = left;
    keys.forEach(k => {
      const s = $("s" + k), cap = Math.min(10, stats[k] + left);
      s.value = stats[k];
      s.style.setProperty("--val", pos(stats[k]));
      s.style.setProperty("--cap", pos(cap));
      s.setAttribute("aria-valuetext", `${stats[k]}점 (최대 ${cap}점까지)`);
      $("v" + k).textContent = stats[k];
    });
    const { W, L, D } = stats;
    $("eW").textContent = `살 수 있는 차: ${CARS.filter(c => c.cost <= W).map(c => c.short).join(", ")}` +
      `${W >= CARS[2].cost + NAVLINK.cost ? " + 내비 연동" : ""} · 보험 출동 ${insCount(W)}회`;
    $("eL").textContent = `좋은 일 ×${toneMult(L, "good").toFixed(2)} · 나쁜 일 ×${toneMult(L, "bad").toFixed(2)} · 운 판정 ${sign(MOD[L])} · 행운 부적 ${cloverCount(L)}장`;
    $("eD").textContent = `사고율 ×${skillMult(D).toFixed(2)} · 이 코스 120km/h 성공률 ${100 - Math.round(MODES[2].base * ukka() * skillMult(D))}% · 130km/h ${100 - Math.round(MODES[3].base * ukka() * skillMult(D))}%`;
    // 총점은 상한일 뿐. 다 안 써도(1·1·1이어도) 출발할 수 있다
    $("toCar").textContent = left > 0 ? `${left}점 버리고 차 고르기` : "차 고르기";
  };
  // 총점을 넘기려 하면 갈 수 있는 끝에서 멈춘다
  keys.forEach(k => {
    $("s" + k).oninput = () => {
      const others = keys.reduce((a, x) => x === k ? a : a + stats[x], 0);
      stats[k] = clamp(+$("s" + k).value, 1, Math.min(10, POOL - others));
      update();
    };
  });
  $("rand").onclick = () => {
    stats = { W: 1, L: 1, D: 1 };
    for (let n = POOL - 3; n > 0;) { const k = keys[rnd(3) - 1]; if (stats[k] < 10) { stats[k]++; n--; } }
    update();
  };
  $("toCar").onclick = carScreen;
  $("toCourse").onclick = courseScreen;
  update();
}

          <span class="risk luck">${pick.id !== "acc" ? "차간간격 크루즈 전용" : W < pick.cost + NAVLINK.cost ? "재력 부족"
            : `${nav ? "장착 · 여비" : "장착하면 여비"} ${won(startMoney(W, pick) - NAVLINK.cost * 40000)}원`}</span>
          <span class="d">${esc(NAVLINK.desc)}</span>
        </button></div>
      <p class="sub">출발 여비 ${won(30000 + (W - spent) * 40000)}원 · 보험 출동 ${insCount(W)}회 · 연료 50 · 피로 25 · 폰 배터리 60%</p>
      <div class="btnrow"><button class="primary" id="go">23:00 출발</button><button class="ghost" id="back">스탯 다시 나누기</button></div>`;

      if (pick !== CARS[+b.dataset.i]) carPop = 1;
      pick = CARS[+b.dataset.i]; draw();
    });
    $("optNav").onclick = () => { nav = !nav; carPop = 1; draw(); };
    drawPreview();
    $("back").onclick = statScreen;
    $("go").onclick = () => { $("log").innerHTML = ""; newRun(pick, nav); renderDash(); play(); };
    focusFirst("#go");
  };
  draw();
}

// 차 고르기 화면의 작은 미리보기
function drawPreview() {
  const c = $("carPrev"); if (!c) return;
  if (!c.__ro) { c.__ro = new ResizeObserver(() => drawPreview()); c.__ro.observe(c); }   // 화면이 돌아가도 다시 그린다
  const g = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1), r = c.getBoundingClientRect();
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = r.width, h = r.height;
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#05080d"); sky.addColorStop(1, "#111925");
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  g.fillStyle = "#151a22"; g.beginPath(); g.moveTo(-w * 0.1, h); g.lineTo(w * 0.46, h * 0.2); g.lineTo(w * 0.54, h * 0.2); g.lineTo(w * 1.1, h); g.fill();
  drawCar(g, preview.car.id, preview.nav, w / 2, h, Math.min(w * 0.3, (h - 14) / 0.95), false);
}

async function driveSegment(m) {
  const risk = modeRisk(m);
  // 110km/h 2차로는 가끔 앞차들이 굼떠서 90km/h로 끌려간다
  const slowed = m.id === "m110" && Math.random() < Math.min(0.75, 0.4 * ukka());
  const km = slowed ? 45 : m.km;
  const frac = Math.min(1, (GOAL - S.km) / km), from = S.km;
  // 끌려간 구간은 실제로 90km/h로 달린 것으로 친다 (카메라·돌발 상황 위험도)
  S.seg++; S.modes[m.id]++; S.lastMode = m.id; S.lastKmh = slowed ? 90 : m.kmh; S.lane = m.lane; S.speed = S.lastKmh;
  S.segLimit = limitAt(S.km);
  const title = `${m.lane}차로 · ${m.kmh}km/h`;
  panel.innerHTML = head(`구간 ${S.seg}`, title, slowed ? "2차로 앞차들이 굼뜨다…" : "달리는 중…");
  await wait(900);
  applyFx({ km: km * frac, t: SEG * frac, fuel: -m.fuel * frac, fat: m.fat * S.car.fatMult * skipMult() * frac });
  if (S.nav && !S.navlink && S.bat > 0) {
    S.bat = Math.max(0, S.bat - 12 * frac);
    if (S.bat <= 0) log("폰 배터리가 꺼졌다. 내비도 같이 꺼졌다.", "bad");
    renderDash();
  }
  if (S.rain) S.rain--;
  if (slowed) log(`2차로 앞차들 때문에 한참 90km/h로 끌려갔다. ${Math.round(km * frac)}km.`, "bad");
  else log(`${ro(m.name)} ${Math.round(km * frac)}km 달렸다.`);
  const r = await roll(head(`구간 ${S.seg}`, title, ""), { type: "d100", pct: 100 - risk, label: "사고 판정" });
  if (r.ok) { await wait(650); return from; }
  S.speed = 0;
  await accident(m.id === "m130" ? -1 : 0, `${S.lastKmh}km/h에서 차가 미끄러졌다.`);
  S.speed = S.lastKmh;
  return from;
}

/* ── 사고·폐차·연료 ──────────────────────────────────── */
const SEVERITY = [
  { min: 11, label: "가벼운 접촉", hp: -20, t: 20, cost: 40000 },
  { min: 7, label: "사고", hp: -42, t: 40, cost: 90000 },
  { min: -99, label: "대형 사고", hp: -65, t: 70, cost: 160000 },
];
async function accident(sevMod, cause) {
  S.accidents++; flash();
  const mod = skillMod() + sevMod;
  const html = head("사고", "쾅!", cause);
  const r = await roll(html, { type: "2d6", mod, tiers: SEVERITY, label: "사고 규모 (운전실력 보정)" });
  const sev = r.tier;
  const dmg = applyFx({ hp: sev.hp });
  log(`${sev.label}! ${cause}`, "bad");
  // 차체가 0이 되면 보험도 돈도 소용없다. 바로 폐차
  if (S.hp <= 0) {
    await appendOut(`${sev.label}. 차가 완전히 망가졌다.`, dmg, "견인차를 부른다");
    return gameOver("폐차", WRECK_TEXT);
  }
  await appendOut(`${sev.label}. 수습하는 데 ${sev.t}분이 걸릴 판이다.`, dmg, "수습하러 간다");
  const opts = [];
  if (S.ins > 0) opts.push({ t: `보험 긴급출동 부르기 (남은 ${S.ins}회)`, d: "처리 시간 절반, 망가진 차체 절반 복구",
    fx: { ins: -1, t: Math.round(sev.t / 2), hp: Math.round(-sev.hp / 2) } });
  opts.push({ t: "현장에서 돈으로 수습", d: "합의·처리 시간 절반",
    meta: `${won(sev.cost)}원`, disabled: S.money <= sev.cost, fx: { money: -sev.cost, t: Math.round(sev.t / 2) } });
  opts.push({ t: "혼자 수습한다", d: "시간은 다 쓴다", fx: { t: sev.t } });
  const i = await ask(head("사고 수습", sev.label, "어떻게 수습할까?"), opts);
  const chips = applyFx(opts[i].fx);
  log(`사고 수습: ${opts[i].t.replace(/ \(.*\)$/, "")}`);   // 「남은 N회」는 쓰기 전 숫자라 기록에서 뺀다
  await appendOut(S.inTown ? "다시 집으로 향한다." : "다시 출발한다.", chips);
}
const WRECK_TEXT = "차가 더는 못 굴러간다. 폐차다. 집에는 내일이나 가겠네.";
// 이벤트 결과로 여비나 차체가 바닥났을 때
async function wreckCheck() {
  if (!S.over && S.money <= 0)
    return gameOver("파산", `여비가 ${won(S.money)}원이 됐다. 카드도 하이패스도 막혔다. 갓길에 차를 세우고 비상등을 켰다.`);
  if (S.hp > 0 || S.over) return;
  return gameOver("폐차", WRECK_TEXT);
}
async function outOfFuel() {
  if (S.fuel > 0 || S.over) return;
  S.speed = 0; log("연료가 바닥났다.", "bad");
  const opts = [];
  if (S.ins > 0) opts.push({ t: `보험 긴급출동 (남은 ${S.ins}회)`, d: "비상 급유 연료 +20", fx: { ins: -1, fuel: 20, t: 35 } });
  opts.push({ t: "긴급 급유 서비스", d: "연료 +20", meta: "50,000원", disabled: S.money <=50000, fx: { money: -50000, fuel: 20, t: 35 } });
  if (opts.every(o => o.disabled)) return gameOver("연료 바닥", "갓길에 차를 세우고 비상등을 켰다. 부를 사람도, 돈도 없다.");
  const i = await ask(head("연료 바닥", "엔진이 꺼졌다", "갓길에 겨우 차를 붙였다."), opts);
  await appendOut("비상 급유를 받았다.", applyFx(opts[i].fx));
  S.speed = S.lastKmh;
}

/* ── 휴게소 ──────────────────────────────────────────── */
async function restStop(stop) {
  S.stopsSeen.add(stop.km);
  S.speed = 40;
  const n = S.skipStreak + 1;
  const enter = await ask(head("휴게소", `${stop.name} 진입로`, "들르면 들어가고 나오는 데만 10분이 걸린다."),
    [{ t: "들른다", d: `주유·커피·쪽잠·정비${S.navlink ? "" : "·충전"}. 쌓인 강행군 피로도 풀린다` },
     { t: "지나친다", d: `시간을 아낀다. 연속 ${n}번째라 피로 +${4 * n}, 이후 피로가 ×${skipMult(n).toFixed(1)} 빨리 쌓인다` }]);
  if (enter === 1) {
    S.skipStreak = n;
    const chips = applyFx({ fat: 4 * n });
    log(`${eul(stop.name)} 지나쳤다. (연속 ${n}번째)`, "bad");
    await appendOut(n > 1 ? "몸이 쉬자고 아우성이다." : "아직은 버틸 만하다.", chips);
    S.speed = S.lastKmh;
    return;
  }
  S.skipStreak = 0; S.stopsEntered++; S.resting = true;
  applyFx({ t: 10 }); S.speed = 0; log(`${stop.name}에 들렀다.`);
  const used = { coffee: 0, nap: 0, fix: 0, charge: 0, gacha: 0 };
  let last = [];
  for (;;) {
    const items = [
      // 약속한 만큼 다 못 올라가면(거의 가득) 살 수 없다. 돈만 나가고 +3 같은 게 나오지 않게
      { id: "fuel", t: "주유 2만 원어치", d: S.fuel > 70 ? "연료가 거의 가득" : "연료 +30 · 5분", meta: "20,000원", disabled: S.fuel > 70 || S.money <= 20000 },
      { id: "coffee", t: "커피", d: S.fat < 15 ? "지금은 안 피곤하다" : `피로 −15 · 5분 (${2 - used.coffee}잔 남음)`, meta: "4,000원", disabled: used.coffee >= 2 || S.fat < 15 || S.money <= 4000 },
      { id: "nap", t: "쪽잠", d: "피로 −45 · 20분", meta: "무료", disabled: used.nap >= 1 },
      { id: "fix", t: "경정비", d: S.hp > 70 ? "정비할 데가 거의 없다" : "차체 +30 · 15분", meta: "30,000원", disabled: used.fix >= 1 || S.hp > 70 || S.money <= 30000 },
      ...(S.navlink ? [] : [{ id: "charge", t: "폰 충전", d: "배터리 +50 · 10분", meta: "무료", disabled: used.charge >= 1 || S.bat >= 100 }]),
      { id: "gacha", t: "인형뽑기", d: `한 판 2,000원 · 10+ 행운 부적 · 7+ 인형 (${3 - used.gacha}판 남음)`, meta: `부적 ${p2d6(10, luckMod())}%`,
        cls: "luck", disabled: used.gacha >= 3 || S.money <= 2000 },
      { id: "go", t: "출발한다" },
    ];
    const i = await ask(head(stop.name, "무엇을 할까?", `머문 시간은 모두 기록에 들어간다.`) + fxHtml(last), items);
    const id = items[i].id;
    if (id === "go") { S.speed = S.lastKmh; S.resting = false; log(`${stop.name}에서 출발했다.`); return; }
    if (id === "fuel") last = applyFx({ money: -20000, fuel: 30, t: 5 });
    if (id === "coffee") { used.coffee++; last = applyFx({ money: -4000, fat: -15, t: 5 }); }
    if (id === "nap") { used.nap++; last = applyFx({ fat: -45, t: 20 }); }
    if (id === "fix") { used.fix++; last = applyFx({ money: -30000, hp: 30, t: 15 }); }
    if (id === "charge") {
      used.charge++; const b = S.bat; S.bat = Math.min(100, S.bat + 50);
      last = applyFx({ t: 10 }); last.push({ txt: `배터리 +${Math.round(S.bat - b)}`, pos: true }); renderDash();
    }
    if (id === "gacha") {
      used.gacha++; applyFx({ money: -2000 });
      const r = await roll(head(stop.name, "인형뽑기", "집게가 내려간다…"), { type: "2d6", mod: luckMod(), noReroll: true, tiers: [
        { min: 10, label: "부적 인형!", fx: { clover: 1 } }, { min: 7, label: "작은 인형", fx: { dolls: 1 } }, { min: -99, label: "꽝" }] });
      last = applyFx(r.tier.fx);
      if (r.tier.fx) log(`인형뽑기: ${r.tier.label}`, "good");
      await appendOut(r.tier.min >= 10 ? "네잎클로버를 든 인형이 나왔다." : r.tier.fx ? "작은 인형을 하나 건졌다." : "집게가 허공을 쥐었다.", last);
    }
  }
}

/* ── 이벤트 진행 ─────────────────────────────────────── */
async function psychEvent(e, cfg) {
  const ws = cfg.types.map(t => toneMult(S.stats.L, t.tone)), tot = ws.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot, type = cfg.types[cfg.types.length - 1];
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) { type = cfg.types[i]; break; } }
  const succ = (c, t = type) => 100 - eventRisk(c.riskBy[t.id]);
  const avg = c => Math.round(cfg.types.reduce((a, t, i) => a + succ(c, t) * ws[i], 0) / tot);
  const kicker = navOn() ? "구간 이벤트 · 내비 ON" : "구간 이벤트";
  let read = false, known = false, note = "";
  for (;;) {
    const items = [];
    if (!read) items.push({ t: "상대 심리를 읽는다", d: "2분 · 운전실력 판정. 성공하면 상대 유형과 정확한 성공률이 보인다",
      meta: `성공률 ${p2d6(7, skillMod())}%`, cls: "luck", read: true });
    cfg.choices.forEach(c => {
      if (!c.riskBy) return items.push({ t: c.t, d: c.d, c });
      const p = known ? succ(c) : avg(c);
      items.push({ t: c.t, d: c.d, meta: known ? `성공률 ${p}%` : `성공률 약 ${p}%`, cls: riskCls(p), c });
    });
    const i = await ask(head(kicker, e.title, cfg.text() + (note ? " " + note : "")), items);
    if (items[i].read) {
      read = true; applyFx({ t: 2 });
      const rr = await roll(head(e.title, "상대 심리를 읽는다", ""), { type: "2d6", mod: skillMod(), target: 7, label: "눈치 판정 (운전실력)" });
      known = rr.ok;
      if (known) S.flags.add("mind");
      note = known ? `[${type.name}] ${type.read}` : "아무리 봐도 속을 모르겠다.";
      log(`${e.title} — ${known ? ro(type.name) + " 읽었다." : "상대를 읽지 못했다."}`);
      await appendOut(note);
      continue;
    }
    const c = items[i].c;
    let out = c.res;
    if (c.riskBy) {
      const rr = await roll(head(e.title, c.t, ""), { type: "d100", pct: succ(c), label: "운전 판정" });
      if (!rr.ok) { S.speed = 0; await accident(0, `${e.title} — 「${c.t}」 실패. 상대는 ${type.name}이었다.`); S.speed = S.lastKmh; return; }
      out = c.ok;
    } else panel.innerHTML = head(e.title, c.t, "");
    const chips = applyFx(out.fx);
    const txt = out.text + (known ? "" : ` 상대는 ${type.name}이었다.`);
    log(`${e.title} — ${txt}`, chips.some(x => !x.pos) ? "bad" : chips.length ? "good" : "");
    await appendOut(txt, chips);
    return;
  }
}

// 고른 선택지를 판정하고 결과를 적용한다. sevMod > 0이면 사고가 덜 크게 난다(동네 저속 등)
async function resolveChoice(title, c, sevMod = 0) {
  const h = head(title, c.t, "");
  let out;
  if (c.kind === "luck") {
    const r = await roll(h, c.tiers ? { type: "2d6", mod: luckMod(), tiers: c.tiers, label: "행운 판정" }
      : { type: "2d6", mod: luckMod(), target: c.target, label: "행운 판정" });
    out = c.tiers ? r.tier : r.ok ? c.ok : c.bad;
  } else if (c.kind === "risk") {
    const r = await roll(h, { type: "d100", pct: 100 - eventRisk(c.risk, c.follow), label: "운전 판정" });
    if (!r.ok) {
      if (S.inTown && c.call && storyRun()) return storyCrash();
      S.speed = 0; await accident(sevMod, c.cause || `${title} — 「${c.t}」 실패.`); S.speed = S.lastKmh; return;
    }
    out = c.ok;
  } else {
    panel.innerHTML = h;
    out = c.res;
  }
  if (out.luck) {   // 무사히 넘긴 뒤 이어지는 행운 판정 (예: 속도를 다 줄였나)
    const r = await roll(h, { type: "2d6", mod: luckMod(), target: out.luck.target, label: out.luck.label || "행운 판정" });
    out = r.ok ? out.luck.ok : out.luck.bad;
  }
  const chips = applyFx(out.fx);
  const txt = typeof out.text === "function" ? out.text() : out.text;
  log(`${title} — ${txt}`, chips.some(x => !x.pos) ? "bad" : chips.length ? "good" : "");
  await appendOut(txt, chips);
  await wreckCheck();
}
async function encounter(kicker, title, text, cs, sevMod = 0) {
  const i = await ask(head(kicker, title, text), cs.map(decorate));
  await resolveChoice(title, cs[i], sevMod);
}
async function runEvent(e) {
  S.seen[e.id] = (S.seen[e.id] || 0) + 1;
  if (e.custom) { await e.custom(e); await wreckCheck(); return; }
  await encounter(navOn() && e.id !== "ghost" ? "구간 이벤트 · 내비 ON" : "구간 이벤트", e.title, e.text(), e.choices());
}

/* ── 앞차 비상등: 5초 안에 브레이크 + 비상등 ─────────── */
let activeQte = null;   // 진행 중인 5초 판정. 재시작 창이 뜨면 시계를 멈춘다
function hazardQTE(where) {
  const bBtn = `<button class="qbtn" id="qB">브레이크<small>스페이스 · B</small></button>`;
  const hBtn = `<button class="qbtn hz" id="qH">비상등<small>H</small></button>`;
  panel.innerHTML = head(where, "앞차가 비상등을 켜고 서 있다!", "브레이크를 밟고 비상등을 켜라. 5초 안에. 빠를수록 뒤차가 피할 여유가 생긴다.") +
    `<div class="qbar"><i id="qFill"></i></div><div class="qbtns">${Math.random() < 0.5 ? hBtn + bBtn : bBtn + hBtn}</div>`;
  const run = S;
  return new Promise(resolve => {
    const LIMIT = 5000;
    let t0 = performance.now(), pausedAt = null;
    let brake = false, hazard = false, done = false, timer;
    let brakeMs = LIMIT, hazardMs = LIMIT;   // 각각 누른 시점. 못 누르면 제한 시간 그대로
    const end = () => {
      if (done) return; done = true; clearInterval(timer); removeEventListener("keydown", onKey); activeQte = null;
      if (S === run) resolve({ brake, hazard, ms: performance.now() - t0, brakeMs, hazardMs });   // 재시작했으면 이전 판은 여기서 멈춘다
    };
    const press = k => {
      if (done || S !== run || pausedAt !== null) return;
      const at = Math.min(LIMIT, performance.now() - t0);
      if (k === "b" && !brake) { brake = true; brakeMs = at; $("qB").classList.add("on"); $("qB").disabled = true; S.speed = 0; }
      if (k === "h" && !hazard) { hazard = true; hazardMs = at; $("qH").classList.add("on"); $("qH").disabled = true; }
      if (brake && hazard) end();
    };
    const onKey = e => {
      if (done || S !== run || pausedAt !== null) return;   // 끝났거나 재시작했거나 창이 떠 있으면 키를 건드리지 않는다
      if (e.code === "Space" || e.code === "KeyB") { e.preventDefault(); press("b"); }
      else if (e.code === "KeyH") { e.preventDefault(); press("h"); }
    };
    addEventListener("keydown", onKey);
    $("qB").onclick = () => press("b");
    $("qH").onclick = () => press("h");
    timer = setInterval(() => {
      if (S !== run) return end();          // 재시작하면 바로 정리한다
      if (pausedAt !== null) return;        // 재시작 창이 떠 있는 동안은 시계가 선다
      const left = Math.max(0, 1 - (performance.now() - t0) / LIMIT);
      const f = $("qFill"); if (f) f.style.width = left * 100 + "%";
      if (left <= 0) end();
    }, 40);
    activeQte = {
      pause() { if (pausedAt === null) pausedAt = performance.now(); },
      resume() { if (pausedAt !== null) { t0 += performance.now() - pausedAt; pausedAt = null; } },
    };
  });
}
async function hazardEvent(where) {
  const r = await hazardQTE(where);
  const sec = (r.ms / 1000).toFixed(1);
  if (r.brake && r.hazard && r.ms < 1000) S.flags.add("reflex");
  if (!r.brake && !r.hazard) S.flags.add("freeze");
  // 차간간격 크루즈는 앞차가 서 있으면 알아서 멈춘다 (비상등은 사람이 켜야 한다)
  let auto = false;
  if (!r.brake && S.car.id === "acc") { r.brake = true; auto = true; log("차간간격 크루즈가 먼저 브레이크를 밟았다.", "good"); }
  if (r.brake && r.hazard) {
    // 빨리 멈출수록 뒤차가 피할 여유가 생긴다: 1초 안이면 3+, 1초 늦을 때마다 목표가 1씩 올라가 5초면 7+
    const react = auto ? r.hazardMs : r.ms;
    const rs = (react / 1000).toFixed(1);
    const target = Math.min(7, 3 + Math.floor(react / 1000));
    const how = auto ? `비상등은 ${rs}초 만에 켰고, 브레이크는 크루즈가 밟았다` : `${sec}초 만에 브레이크와 비상등`;
    log(`${where} — 앞차 비상등. ${how}.`, "good");
    const rr = await roll(head(where, auto ? how : `${sec}초. 브레이크와 비상등 둘 다!`,
        react < 1000 ? "거의 바로 멈췄다. 뒤차도 여유가 있다." : react < 3000 ? "이제 뒤차가 알아봐 주기만 하면 된다." : "늦게 멈춘 만큼 뒤차도 급하다."),
      { type: "2d6", mod: luckMod(), target, label: `${rs}초 반응 · 뒤차가 알아봤나 (행운)` });
    if (!rr.ok) await accident(0, "비상등까지 켰는데 뒤차가 졸고 있었다.");
    else await appendOut("뒤차들도 줄줄이 멈춰 섰다. 앞차가 비킬 때까지 기다렸다.", applyFx({ t: 6 }));
  } else if (r.brake) {
    // 브레이크만: 밟은 시점이 늦을수록 위험. 크루즈가 밟은 건 중간값(2.5초)으로 친다
    const secB = auto ? 2.5 : r.brakeMs / 1000;
    log(`${where} — 앞차 비상등. ${auto ? "크루즈가 브레이크는 밟았지만 비상등은 못 켰다." : `${secB.toFixed(1)}초 만에 브레이크만 밟았다.`}`, "bad");
    const rr = await roll(head(where, auto ? "크루즈가 브레이크를 밟았다" : `${secB.toFixed(1)}초, 브레이크만 밟았다`, "비상등을 못 켰다. 뒤차가 알아챌까?"),
      { type: "d100", pct: 100 - eventRisk(30 + 4 * secB), label: "뒤차 추돌 판정" });
    if (!rr.ok) await accident(0, "비상등이 없어 뒤차가 늦게 알아챘다.");
    else await appendOut("뒤차가 아슬아슬하게 옆 차선으로 비켜 섰다.", applyFx({ t: 6, fat: 10 }));
  } else {
    log(`${where} — 앞차 비상등. ${r.hazard ? "비상등만 켰다." : "반응하지 못했다."}`, "bad");
    S.speed = 0;
    await accident(-1, r.hazard ? "비상등만 켜고 브레이크는 못 밟았다." : "얼어붙었다. 앞차를 그대로 들이받았다.");
  }
  S.speed = S.lastKmh;
}

/* ── 한 판 ───────────────────────────────────────────── */
async function play() {
  S.speed = S.lastKmh;
  log(`출발. ${S.car.name}${S.navlink ? " + 내비 연동" : ""}.`);
  // 종점에 닿았으면 연료가 바닥나도 요금소까지는 굴러간다
  const after = async () => { await wreckCheck(); if (!S.over && S.km < GOAL) await outOfFuel(); return S.over; };
  // 지나친 터널·다리는 반드시 나온다 (이벤트로 거리를 건너뛰어도)
  const structures = async () => {
    for (const t of C.tunnels) if (t.km <= S.km && !S.tunnelsSeen.has(t.km)) {
      S.tunnelsSeen.add(t.km);
      await tunnelEvent(t);
      if (S.over || await after()) return true;
      if (t.name === "인제양양터널") S.flags.add("inje");
    }
    if (C.bridge && !S.bridgeSeen && C.bridge.km <= S.km) {
      S.bridgeSeen = true;
      await bridgeEvent(C.bridge);
      if (S.over || await after()) return true;
    }
    return false;
  };
  const home = async () => { if (await structures()) return; await townStage(); if (!S.over) finish(); };
  while (!S.over) {
    const m = await pickMode();
    await driveSegment(m);
    if (S.over || await after()) return;
    if (await structures()) return;
    // 단속 카메라는 구간마다 반드시 나온다
    await cameraCheck(m);
    if (S.over || await after()) return;
    // 120km/h 1차로는 뒤차가 붙는다
    if (m.id === "m120" && Math.random() < 0.6) {
      await runEvent(EVENTS.find(e => e.id === "tailgate"));
      if (S.over || await after()) return;
    }
    if (S.km >= GOAL) return home();
    // 이벤트는 매 구간 하나, 코스 별과 행운에 따라 하나 더(★5·행운 6이면 65%, 행운 1이면 80%(상한), 행운 10이면 38%).
    // 행운이 아무리 낮아도 매번 두 개는 아니어야 운 좋은 판에 A가 나올 수 있다. 휴게소에 들르는 구간도 가는 길에 먼저 겪는다
    const n = 1 + (Math.random() < Math.min(0.8, (0.15 + 0.12 * C.star) * (1.4 - 0.09 * S.stats.L)) ? 1 : 0);
    for (let k = 0; k < n; k++) {
      await runEvent(drawEvent());
      if (S.over || await after()) return;
      if (S.km >= GOAL) return home();
    }
    // 한 구간에 휴게소를 여러 곳 지났으면 가장 최근(지금 위치에 가까운) 곳만 들를 수 있다
    const passed = STOPS.filter(s => s.km <= S.km && !S.stopsSeen.has(s.km));
    passed.slice(0, -1).forEach(s => { S.stopsSeen.add(s.km); log(`${eul(s.name)} 지나쳤다.`); });
    if (passed.length) await restStop(passed[passed.length - 1]);
  }
}

    { wave: "square", vol: 0.045, legato: 0.85, notes: seq(`
      F#4:1 F#4:1 G4:1 A4:1 A4:1 G4:1 F#4:1 E4:1 D4:1 D4:1 E4:1 F#4:1 F#4:1.5 E4:.5 E4:2
      F#4:1 F#4:1 G4:1 A4:1 A4:1 G4:1 F#4:1 E4:1 D4:1 D4:1 E4:1 F#4:1 E4:1.5 D4:.5 D4:2`) },
    { wave: "triangle", vol: 0.08, legato: 0.8, notes: seq(rep("D3:2 A2:2", 7) + " A2:2 D3:2") },
  ] },
  funeral: { loop: false, bpm: 54, parts: [
    { wave: "square", vol: 0.04, legato: 0.9, notes: seq("Bb3:1 Bb3:.75 Bb3:.25 Bb3:2 Db4:1 C4:.75 C4:.25 Bb3:1 A3:.75 A3:.25 Bb3:4") },
    { wave: "triangle", vol: 0.08, legato: 0.6, notes: seq(rep("Bb2+F3:1", 12)) },
  ] },
};
const BGM_KEY = "highway-driver-bgm";
let actx = null, master = null, bgmTimer = null, bgmCur = null, bgmPos = [], creditsOn = false;
// 지금 화면에 맞는 곡
function wantTrack() {
  if (creditsOn || !S) return "gymno";
  if (S.over) return S.ending === "good" ? "joy" : "funeral";
  return S.resting ? "gymno" : "mountain";
}
function tone(n, t, dur, p) {
  [].concat(n).forEach(m => {
    const o = actx.createOscillator(), g = actx.createGain(), len = Math.max(0.05, dur * p.legato);
    o.type = p.wave; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(p.vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.03);
  });
}
// 0.1초마다 1.2초 앞까지의 음을 예약한다(탭이 뒤로 가서 타이머가 느려져도 안 끊기게). 곡이 바뀌면 처음부터
function bgmTick() {
  const want = wantTrack();
  if (want !== bgmCur) { bgmCur = want; bgmPos = TRACKS[want].parts.map(() => ({ i: 0, t: actx.currentTime + 0.08 })); }
  const tr = TRACKS[bgmCur], spb = 60 / (typeof tr.bpm === "function" ? tr.bpm() : tr.bpm);
  tr.parts.forEach((p, k) => {
    const st = bgmPos[k];
    while (st.t < actx.currentTime + 1.2) {
      if (st.i >= p.notes.length) { if (!tr.loop) break; st.i = 0; }
      const [n, b] = p.notes[st.i++];
      if (n !== null) tone(n, st.t, b * spb, p);
      st.t += b * spb;
    }
  });
}
function audioOn() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.6; master.connect(actx.destination);
  }
  actx.resume();
  if (!bgmTimer) bgmTimer = setInterval(bgmTick, 100);
}
function audioOff() { clearInterval(bgmTimer); bgmTimer = null; if (actx) actx.suspend(); }
function setBgm(on) {
  try { localStorage.setItem(BGM_KEY, on ? "on" : "off"); } catch {}
  $("bgmBtn").setAttribute("aria-pressed", on);
  $("bgmBtn").textContent = on ? "♪ 브금 끄기" : "♪ 브금 켜기";
  bgmCur = null;
  if (on) audioOn(); else audioOff();
}
$("bgmBtn").onclick = () => setBgm(!bgmTimer);
// 지난번에 켜 뒀으면 첫 클릭 때 다시 켠다 (브라우저는 클릭 전에는 소리를 못 내게 한다)
(() => {
  let saved = "off"; try { saved = localStorage.getItem(BGM_KEY) || "off"; } catch {}
  if (saved !== "on") return;
  $("bgmBtn").textContent = "♪ 브금 (클릭하면 재생)";
  addEventListener("pointerdown", function once(e) {
    removeEventListener("pointerdown", once);
    if (e.target !== $("bgmBtn") && !bgmTimer) setBgm(true);
  });
})();

/* ── 밤 도로 장면 ────────────────────────────────────── */
const cv = $("road"), ctx = cv.getContext("2d");
let CW = 0, CH = 0, speed = 0, travel = 0, shake = 0, flashT = 0, laneX = 0, carPop = 0;
const stars = Array.from({ length: 80 }, () => [Math.random(), Math.random() * 0.42, 0.3 + Math.random() * 0.7]);
const others = Array.from({ length: 3 }, (_, i) => ({ d: 6 + i * 9, lane: i - 1, v: 95 + Math.random() * 20 }));
function flash() { flashT = 1; shake = reduced ? 0 : 1; }
function resizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), r = cv.getBoundingClientRect();
  CW = r.width; CH = r.height; cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function frame() {
  const target = S ? (S.over ? 0 : S.speed) : 60;   // 끝난 판은 멈춰 서 있는다
  speed += (target - speed) * 0.035;
  travel += speed * (reduced ? 0.00015 : 0.0011);
  $("kmh").textContent = Math.round(speed);
  const w = CW, h = CH, hz = h * 0.44, cx = w / 2 + (shake ? (Math.random() - 0.5) * 10 * shake : 0);
  // 하늘: 04:30부터 06:00까지 동이 튼다
  const minute = (START_CLOCK + (S ? S.t : 0)) % 1440;
  const dawn = minute < 720 ? clamp((minute - 270) / 90, 0, 1) : 0;
  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, rgb(mix([4, 7, 14], [44, 66, 112], dawn)));
  sky.addColorStop(1, rgb(mix([14, 22, 40], [233, 160, 107], dawn)));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, hz);
  ctx.fillStyle = "#ffffff";
  stars.forEach(([x, y, a]) => { ctx.globalAlpha = a * (1 - dawn) * (0.75 + 0.25 * Math.sin(travel * 3 + x * 40)); ctx.fillRect(x * w, y * h, 1.5, 1.5); });
  ctx.globalAlpha = 1;
  // 먼 산 능선
  ctx.fillStyle = rgb(mix([9, 13, 22], [40, 46, 70], dawn));
  ctx.beginPath(); ctx.moveTo(0, hz);
  for (let x = 0; x <= w; x += 8) {
    const n = Math.sin((x + travel * 6) * 0.012) * 0.5 + Math.sin((x + travel * 6) * 0.031 + 1.7) * 0.3;
    ctx.lineTo(x, hz - 14 - n * 16);
  }
  ctx.lineTo(w, hz); ctx.fill();
  // 땅
  ctx.fillStyle = "#05080d"; ctx.fillRect(0, hz, w, h - hz);
  // 도로 (d = 카메라에서의 거리, 1이 화면 아래)
  const Y = d => hz + (h - hz) / d, HALF = d => (w * 0.7) / d;
  // 3차로 도로. 내 차는 화면 가운데에 두고 도로를 옮긴다: 2차로 = 가운데, 1차로 = 왼쪽
  laneX += ((S && S.lane === 1 ? w * 0.7 * 2 / 3 : 0) - laneX) * 0.06;
  const RX = d => cx + laneX / d;
  ctx.fillStyle = "#151a22";
  ctx.beginPath(); ctx.moveTo(RX(1) - HALF(1), h); ctx.lineTo(RX(60) - HALF(60), Y(60)); ctx.lineTo(RX(60) + HALF(60), Y(60)); ctx.lineTo(RX(1) + HALF(1), h); ctx.fill();
  // 전조등 빛
  const beam = ctx.createRadialGradient(cx, h, 10, cx, h, h * 1.1);
  beam.addColorStop(0, "rgba(255,236,190,0.20)"); beam.addColorStop(1, "rgba(255,236,190,0)");
  ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(cx - HALF(1) * 0.7, h); ctx.lineTo(cx - HALF(9) * 0.4, Y(9)); ctx.lineTo(cx + HALF(9) * 0.4, Y(9)); ctx.lineTo(cx + HALF(1) * 0.7, h); ctx.fill();
  // 가장자리 실선
  ctx.strokeStyle = "rgba(230,230,220,0.55)"; ctx.lineWidth = 2;
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(RX(1) + s * HALF(1) * 0.97, h); ctx.lineTo(RX(60) + s * HALF(60) * 0.97, Y(60)); ctx.stroke(); });
  // 차선 점선과 반사봉
  const gap = 2.2, off = (travel % 1) * gap;
  for (let k = 0; k < 30; k++) {
    const d0 = 1 + k * gap - off, d1 = d0 + gap * 0.45;
    if (d0 < 1) continue;
    ctx.fillStyle = "rgba(240,240,230,0.8)";
    [-1 / 3, 1 / 3].forEach(f => {
      const xa = RX(d0) + HALF(d0) * f, xb = RX(d1) + HALF(d1) * f, wa = Math.max(1, 6 / d0), wb = Math.max(0.5, 6 / d1);
      ctx.beginPath(); ctx.moveTo(xa - wa / 2, Y(d0)); ctx.lineTo(xb - wb / 2, Y(d1)); ctx.lineTo(xb + wb / 2, Y(d1)); ctx.lineTo(xa + wa / 2, Y(d0)); ctx.fill();
    });
    ctx.fillStyle = "#ffb547";
    [-1, 1].forEach(s => { const r = Math.max(1, 5 / d0); ctx.fillRect(RX(d0) + s * HALF(d0) * 1.1 - r / 2, Y(d0) - r * 3, r, r * 2); });
  }
  // 앞차 미등
  others.forEach(o => {
    o.d += (o.v - speed) * 0.0009;
    if (o.d < 1.6 || o.d > 60) { o.d = 30 + Math.random() * 25; o.lane = rnd(3) - 2; o.v = 95 + Math.random() * 25; }
    const x = RX(o.d) + HALF(o.d) * o.lane * 0.66, y = Y(o.d) - 18 / o.d, sp = 26 / o.d, r = Math.max(1.2, 5 / o.d);
    ctx.fillStyle = "rgba(255,60,50,0.25)"; [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * sp, y, r * 2.4, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#ff4a3d"; [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * sp, y, r, 0, 7); ctx.fill(); });
  });
  // 비
  if (S && S.rain) {
    ctx.strokeStyle = "rgba(170,200,255,0.35)"; ctx.lineWidth = 1;
    for (let i = 0; i < 70; i++) { const x = Math.random() * w, y = Math.random() * h; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 14); ctx.stroke(); }
  }
  // 내 차 (뒷모습). 출발 전에는 차 고르기에서 고른 차를 보여 준다
  const braking = target < speed - 3;
  carPop = Math.max(0, carPop - 0.05);
  drawCar(ctx, S ? S.car.id : preview.car.id, S ? S.navlink : preview.nav, cx, h,
    clamp(w * 0.17, 84, 140) * (1 + 0.1 * Math.sin(carPop * Math.PI)), braking || flashT > 0);
  // 사고 번쩍임

  shake = Math.max(0, shake - 0.02);

}
// 차 종류마다 실루엣이 다르다.
// none = 키 큰 경차 해치백(세로 미등), cc = 세단(가로 미등·트렁크), acc = 넓고 낮은 SUV(일자 LED 미등·머플러 두 개)
// 내비 연동 옵션(acc 전용)을 달면 아예 다른 차가 된다: ev = 순정 내비가 달린 신형 전기 SUV(펄 화이트·통유리 지붕·파란 번호판)
function drawCar(g, kind, nav, cx, bottom, base, lit) {
  if (kind === "acc" && nav) kind = "ev";
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };
  const tail = lit ? "#ff6a5c" : "#d8372e", halo = `rgba(255,70,60,${lit ? 0.38 : 0.2})`;
  const glowAt = (x, y, rx, ry) => { g.fillStyle = halo; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); };
  let cw, bh, x0, y0, roofTop;
  if (kind === "none") {
    cw = base * 0.84; bh = cw * 0.4; x0 = cx - cw / 2; y0 = bottom - bh - 5; roofTop = y0 - bh * 1.15;
    g.fillStyle = "#000"; g.fillRect(x0 + cw * 0.1, bottom - 11, cw * 0.14, 9); g.fillRect(x0 + cw * 0.76, bottom - 11, cw * 0.14, 9);
    g.fillStyle = "#4f5648"; rr(x0 + cw * 0.06, roofTop, cw * 0.88, bh * 1.3, 14); g.fill();          // 높은 지붕
    g.fillStyle = "#0b1119"; rr(x0 + cw * 0.14, roofTop + bh * 0.16, cw * 0.72, bh * 0.82, 9); g.fill(); // 큰 뒷유리
    g.fillStyle = "#6b7262"; rr(x0, y0, cw, bh, 10); g.fill();
    [0.02, 0.86].forEach(f => {                                                                      // 세로 미등
      glowAt(x0 + cw * (f + 0.06), y0 - bh * 0.05, cw * 0.1, bh * 0.55);
      g.fillStyle = tail; rr(x0 + cw * f, y0 - bh * 0.5, cw * 0.12, bh * 0.85, 4); g.fill();
    });
    g.fillStyle = "#1a1d1a"; g.fillRect(x0 + cw * 0.04, y0 + bh * 0.72, cw * 0.92, bh * 0.2);
  } else if (kind === "cc") {
    cw = base; bh = cw * 0.4; x0 = cx - cw / 2; y0 = bottom - bh - 4; roofTop = y0 - bh * 0.48;
    g.fillStyle = "#000"; g.fillRect(x0 + cw * 0.08, bottom - 12, cw * 0.18, 10); g.fillRect(x0 + cw * 0.74, bottom - 12, cw * 0.18, 10);
    g.fillStyle = "#1f2a3a"; rr(x0 + cw * 0.14, roofTop, cw * 0.72, bh * 0.62, 10); g.fill();            // 낮은 캐빈
    g.fillStyle = "#0b1119"; rr(x0 + cw * 0.2, roofTop + bh * 0.1, cw * 0.6, bh * 0.42, 6); g.fill();
    g.fillStyle = "#2b3a50"; rr(x0, y0, cw, bh, 12); g.fill();
    g.fillStyle = "#3a4c66"; g.fillRect(x0 + cw * 0.06, y0 + bh * 0.08, cw * 0.88, 2);                     // 트렁크 선
    [0.04, 0.74].forEach(f => {                                                                       // 가로 미등
      glowAt(x0 + cw * (f + 0.11), y0 + bh * 0.3, cw * 0.2, bh * 0.28);
      g.fillStyle = tail; rr(x0 + cw * f, y0 + bh * 0.18, cw * 0.22, bh * 0.2, 4); g.fill();
    });
    g.fillStyle = "#7d8aa0"; g.fillRect(x0 + cw * 0.27, y0 + bh * 0.27, cw * 0.46, 2);                      // 크롬 몰딩
  } else if (kind === "ev") {
    cw = base * 1.18; bh = cw * 0.38; x0 = cx - cw / 2; y0 = bottom - bh - 6; roofTop = y0 - bh * 0.95;
    g.fillStyle = "#000"; g.fillRect(x0 + cw * 0.05, bottom - 13, cw * 0.2, 11); g.fillRect(x0 + cw * 0.75, bottom - 13, cw * 0.2, 11);
    g.fillStyle = "#e4e8ee"; rr(x0 + cw * 0.07, roofTop, cw * 0.86, bh * 1.05, 14); g.fill();            // 밝은 캐빈
    g.fillStyle = "#070a10"; rr(x0 + cw * 0.11, roofTop + bh * 0.05, cw * 0.78, bh * 0.72, 10); g.fill(); // 지붕까지 이어진 통유리
    g.fillStyle = "rgba(180,200,230,0.22)"; g.fillRect(x0 + cw * 0.16, roofTop + bh * 0.14, cw * 0.68, 2);
    g.fillStyle = "#cfd5dd"; rr(x0 + cw * 0.3, roofTop - bh * 0.05, cw * 0.4, bh * 0.1, 3); g.fill();      // 작은 스포일러
    const body = g.createLinearGradient(0, y0, 0, y0 + bh);
    body.addColorStop(0, "#f2f4f7"); body.addColorStop(0.5, "#d9dee6"); body.addColorStop(1, "#aab2bd");
    g.fillStyle = body; rr(x0, y0, cw, bh, 16); g.fill();                                                 // 펄 화이트 차체
    glowAt(cx, y0 + bh * 0.2, cw * 0.58, bh * 0.22);
    g.fillStyle = tail; rr(x0 + cw * 0.02, y0 + bh * 0.14, cw * 0.96, bh * 0.08, 3); g.fill();            // 끝까지 이어진 일자 미등
    [0.02, 0.9].forEach(f => { rr(x0 + cw * f, y0 + bh * 0.14, cw * 0.08, bh * 0.3, 3); g.fill(); });     // 양 끝은 세로로 꺾인다
    g.fillStyle = "#1a2230"; g.fillRect(x0 + cw * 0.08, y0 + bh * 0.82, cw * 0.84, bh * 0.12);            // 검은 하단 범퍼, 머플러 없음
    g.fillStyle = "#5aa9ff"; g.fillRect(x0 + cw * 0.3, y0 + bh * 0.86, cw * 0.4, 2);                      // 파란 포인트 라인
  } else {
    cw = base * 1.12; bh = cw * 0.4; x0 = cx - cw / 2; y0 = bottom - bh - 6; roofTop = y0 - bh * 0.78;
    g.fillStyle = "#000"; g.fillRect(x0 + cw * 0.06, bottom - 13, cw * 0.2, 11); g.fillRect(x0 + cw * 0.74, bottom - 13, cw * 0.2, 11);
    g.fillStyle = "#232a35"; rr(x0 + cw * 0.08, roofTop, cw * 0.84, bh * 0.9, 12); g.fill();
    g.fillStyle = "#05070a"; rr(x0 + cw * 0.15, roofTop + bh * 0.16, cw * 0.7, bh * 0.52, 7); g.fill();
    g.fillStyle = "rgba(160,180,210,0.18)"; g.fillRect(x0 + cw * 0.2, roofTop + bh * 0.22, cw * 0.6, 2);    // 유리 반사
    g.fillStyle = "#2e3644"; rr(x0 + cw * 0.12, roofTop - bh * 0.06, cw * 0.76, bh * 0.12, 4); g.fill();   // 루프 스포일러
    const body = g.createLinearGradient(0, y0, 0, y0 + bh);
    body.addColorStop(0, "#2a313d"); body.addColorStop(0.35, "#161b23"); body.addColorStop(1, "#0d1016");
    g.fillStyle = body; rr(x0, y0, cw, bh, 14); g.fill();
    glowAt(cx, y0 + bh * 0.24, cw * 0.55, bh * 0.2);                                                   // 일자 LED 미등
    g.fillStyle = tail; rr(x0 + cw * 0.03, y0 + bh * 0.18, cw * 0.94, bh * 0.1, 3); g.fill();
    g.fillStyle = "#b9c2cf"; g.beginPath(); g.arc(cx, y0 + bh * 0.06, Math.max(2, cw * 0.025), 0, 7); g.fill(); // 엠블럼
    g.fillStyle = "#9aa3ae"; [0.2, 0.8].forEach(f => { g.beginPath(); g.ellipse(x0 + cw * f, y0 + bh * 0.93, cw * 0.045, bh * 0.07, 0, 0, 7); g.fill(); });
  }
  // 번호판 (글자가 판 안에 들어가게 크기를 맞춘다). 전기차는 친환경차 파란 번호판
  const ph = bh * 0.3, pw = cw * 0.26, py = y0 + bh * (kind === "none" ? 0.32 : kind === "ev" ? 0.44 : 0.5);
  g.fillStyle = kind === "ev" ? "#bfe0ff" : "#e9edf2"; rr(cx - pw / 2, py, pw, ph, 3); g.fill();
  g.fillStyle = "#1b2433"; g.font = `700 ${Math.max(6, Math.min(ph * 0.62, pw * 0.17))}px "Gothic A1", "Malgun Gothic", sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("00가 0000", cx, py + ph / 2 + 0.5);   // 실제로 발급되지 않는 번호
}
new ResizeObserver(resizeCanvas).observe(cv);
resizeCanvas();
requestAnimationFrame(frame);

setCourse(COURSES[0]);
